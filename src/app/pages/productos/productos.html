
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Productos</h1>

  <div class="d-flex gap-2 align-items-center">
    @if (puedeGestionar()) {
      <button
        type="button"
        class="btn btn-primary btn-sm"
        (click)="abrirCrear()">
        <i class="bi bi-plus-lg me-1"></i>
        Nuevo producto
      </button>
    }

    <button
      type="button"
      class="btn btn-outline-primary btn-sm"
      (click)="obtenerTodos()">
      <i class="bi bi-eye me-1"></i>
      Mostrar productos
    </button>
  </div>
</div>

@if (error()) {
  <div class="alert alert-danger" role="alert">
    {{ error() }}
  </div>
}

@if (mostrarListado()) {
  <div class="card shadow-sm">

    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Listado de productos</h5>

      <div class="d-flex align-items-center gap-2">
        <label for="tamanio" class="form-label mb-0 small text-muted">
          Filas por página
        </label>

        <select
          id="tamanio"
          class="form-select form-select-sm w-auto"
          [value]="tamanio()"
          (change)="cambiarTamanio($any($event.target).value)">
          @for (t of tamaniosDisponibles; track t) {
            <option [value]="t">{{ t }}</option>
          }
        </select>
      </div>
    </div>

    <app-listado
      [columnas]="columnas"
      [datos]="pagina()?.contenido ?? []"
      [acciones]="acciones"
      [cargando]="cargando()"
      [paginaActual]="pagina()?.paginaActual ?? 0"
      [totalPaginas]="pagina()?.totalPaginas ?? 1"
      [totalElementos]="pagina()?.totalElementos ?? 0"
      (cambiarPagina)="cargar($event)"
      (ejecutarAccion)="ejecutarAccion($event)" />

  </div>
}

@if (mostrarModal()) {
  <app-producto-modal
    [producto]="productoSeleccionado()"
    (guardado)="alGuardar()"
    (cancelado)="cerrarModal()" />
}
