<div class="container min-vh-100 d-flex align-items-center justify-content-center">
  <div class="card shadow-sm w-100" style="max-width: 400px">
    <div class="card-body p-4">
      <h1 class="h4 text-center mb-4">Gestión de Inventario</h1>

      @if (error()) {
        <div class="alert alert-danger py-2" role="alert">{{ error() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <input id="username" type="text" class="form-control"
                 formControlName="username" autocomplete="username"
                 [class.is-invalid]="invalido('username')" />
          <div class="invalid-feedback">El usuario es obligatorio.</div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input id="password" type="password" class="form-control"
                 formControlName="password" autocomplete="current-password"
                 [class.is-invalid]="invalido('password')" />
          <div class="invalid-feedback">La contraseña es obligatoria.</div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="cargando()">
          @if (cargando()) {
            <span class="spinner-border spinner-border-sm me-2"></span>
          }
          Iniciar sesión
        </button>
      </form>

      <div class="text-center mt-3 small">
        <a routerLink="/recuperar">¿Olvidaste tu contraseña?</a><br />
        <a routerLink="/registro">Crear una cuenta</a>
      </div>
    </div>
  </div>
</div>
